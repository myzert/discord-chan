<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9eb5"/>
      <stop offset="50%" stop-color="#ff7597"/>
      <stop offset="100%" stop-color="#e85d88"/>
    </linearGradient>
    <linearGradient id="innerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a1f33"/>
      <stop offset="100%" stop-color="#18121f"/>
    </linearGradient>
    <filter id="retroGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#ff85a2" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Outer Squircle with Pixel Accent -->
  <rect x="16" y="16" width="480" height="480" rx="110" ry="110" fill="url(#bgGrad)" filter="url(#retroGlow)"/>
  
  <!-- Pixel Frame Outline -->
  <rect x="28" y="28" width="456" height="456" rx="98" ry="98" fill="url(#innerGrad)" stroke="#ffb3c6" stroke-width="6"/>

  <!-- Pixel Grid Pattern in Background -->
  <g opacity="0.12" fill="#ff85a2">
    <rect x="64" y="64" width="16" height="16"/>
    <rect x="96" y="64" width="16" height="16"/>
    <rect x="128" y="64" width="16" height="16"/>
    <rect x="368" y="64" width="16" height="16"/>
    <rect x="400" y="64" width="16" height="16"/>
    <rect x="432" y="64" width="16" height="16"/>
    <rect x="64" y="432" width="16" height="16"/>
    <rect x="432" y="432" width="16" height="16"/>
  </g>

  <!-- Discord-Chan Neko Face Vector -->
  <g transform="translate(256, 260)">
    <!-- Cat Ears Left -->
    <path d="M -130 -60 L -175 -170 L -65 -130 Z" fill="#ffffff" stroke="#ff85a2" stroke-width="8" stroke-linejoin="round"/>
    <path d="M -125 -75 L -160 -150 L -80 -125 Z" fill="#ffb8cc"/>

    <!-- Cat Ears Right -->
    <path d="M 130 -60 L 175 -170 L 65 -130 Z" fill="#ffffff" stroke="#ff85a2" stroke-width="8" stroke-linejoin="round"/>
    <path d="M 125 -75 L 160 -150 L 80 -125 Z" fill="#ffb8cc"/>

    <!-- Head Contour (Neko Squircle Mascot) -->
    <path d="M -150 -40 C -150 70, -110 130, 0 130 C 110 130, 150 70, 150 -40 C 150 -110, 80 -120, 0 -120 C -80 -120, -150 -110, -150 -40 Z" 
          fill="#ffffff" stroke="#ff85a2" stroke-width="10" stroke-linejoin="round"/>

    <!-- Eyes (Cute Anime Closed / Shy Blushing) -->
    <!-- Left Eye -->
    <path d="M -85 -20 Q -55 -45, -25 -20" fill="none" stroke="#2a1f33" stroke-width="9" stroke-linecap="round"/>
    <circle cx="-55" cy="-12" r="5" fill="#2a1f33"/>
    
    <!-- Right Eye -->
    <path d="M 25 -20 Q 55 -45, 85 -20" fill="none" stroke="#2a1f33" stroke-width="9" stroke-linecap="round"/>
    <circle cx="55" cy="-12" r="5" fill="#2a1f33"/>

    <!-- Cute Blush Marks -->
    <ellipse cx="-80" cy="18" rx="20" ry="12" fill="#ff8da9" opacity="0.75"/>
    <ellipse cx="80" cy="18" rx="20" ry="12" fill="#ff8da9" opacity="0.75"/>
    <!-- Blush Lines -->
    <line x1="-90" y1="18" x2="-70" y2="18" stroke="#ff4d79" stroke-width="3" stroke-linecap="round"/>
    <line x1="70" y1="18" x2="90" y2="18" stroke="#ff4d79" stroke-width="3" stroke-linecap="round"/>

    <!-- Neko Smile Mouth (3 shape) -->
    <path d="M -22 15 Q -10 32, 0 18 Q 10 32, 22 15" fill="none" stroke="#2a1f33" stroke-width="7" stroke-linecap="round"/>

    <!-- Sweat Drop (Cute Flustered Detail) -->
    <path d="M 95 -60 Q 105 -80, 105 -90 Q 95 -80, 95 -60" fill="#70b5ff" stroke="#4a90e2" stroke-width="3"/>
  </g>

  <!-- Pixel Sparkle Stars -->
  <!-- Top Left Sparkle -->
  <g transform="translate(100, 110) scale(1.4)" fill="#fff1f5">
    <polygon points="0,-16 4,-4 16,0 4,4 0,16 -4,4 -16,0 -4,-4"/>
  </g>
  <!-- Top Right Sparkle -->
  <g transform="translate(410, 130) scale(1.1)" fill="#fff1f5">
    <polygon points="0,-16 4,-4 16,0 4,4 0,16 -4,4 -16,0 -4,-4"/>
  </g>
  <!-- Bottom Right Mini Sparkle -->
  <g transform="translate(420, 390) scale(0.9)" fill="#ff9eb5">
    <polygon points="0,-16 4,-4 16,0 4,4 0,16 -4,4 -16,0 -4,-4"/>
  </g>
</svg>
